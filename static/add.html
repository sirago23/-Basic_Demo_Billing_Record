<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>บันทึกรายรับ-รายจ่าย</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Sarabun:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="top"><div class="brand"><span class="logo">฿</span>บันทึกรายรับ-รายจ่าย</div><nav><a href="/">สรุป</a><a href="/list">รายการ</a><a href="/add" class="active" aria-current="page">เพิ่มรายการ</a></nav></header>
  <main>
    <section class="panel" id="add-section">
      <h2 id="form-title">เพิ่มรายการ</h2>
      <div class="add-grid">
        <div>
          <label class="drop" id="drop" tabindex="0">
            <input type="file" id="file" accept="image/jpeg,image/png,image/webp" hidden>
            <img id="preview" alt="" hidden>
            <span id="drop-text">ลากสลิป/ใบเสร็จมาวาง หรือคลิกเพื่อเลือกรูป<br><small>JPG, PNG, WEBP ไม่เกิน 5MB</small></span>
          </label>
          <div id="status" role="status"></div>
        </div>
        <form id="form" autocomplete="off">
          <div class="toggle" id="type-toggle">
            <button type="button" data-type="expense" class="active">รายจ่าย</button>
            <button type="button" data-type="income">รายรับ</button>
          </div>
          <label>จำนวนเงิน (บาท)<input type="number" id="amount" step="0.01" min="0.01" required></label>
          <label>หมวดหมู่<select id="category" required></select></label>
          <label>วันที่<input type="date" id="date" required></label>
          <label>รายละเอียด<input type="text" id="description" maxlength="200"></label>
          <div class="actions">
            <button type="submit" id="submit" class="primary">บันทึก</button>
            <button type="button" id="cancel" class="secondary" hidden>ยกเลิกการแก้ไข</button>
          </div>
        </form>
      </div>
    </section>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
